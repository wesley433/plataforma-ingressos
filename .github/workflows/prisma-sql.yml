name: Prisma SQL (gerar)

on:
  push:
    branches: [tools/prisma-sql]

permissions:
  contents: write

jobs:
  sql:
    if: "!contains(github.event.head_commit.message, '[gerado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: mkdir -p out && npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > out/init.sql
      - run: npm ls --depth=0 > out/versions.txt || true
      - run: cp package-lock.json out/package-lock.json
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add out
          git commit -m "SQL gerado [gerado]"
          git push
