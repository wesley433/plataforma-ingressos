name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # banco descartável do CI; nada aqui acessa serviços reais
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # troque por "npm ci" (e adicione cache: npm acima) depois de versionar o package-lock.json
      - run: npm install
      - run: npx prisma validate
      - name: Migrations aplicam num Postgres limpo (com auth.users simulado)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create schema auth; create table auth.users (id uuid primary key, email text, raw_user_meta_data jsonb);"
          npx prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into auth.users values (gen_random_uuid(), 'teste@ci.com', '{\"name\":\"Teste CI\"}');"
          test "$(psql "$DATABASE_URL" -tAc "select name from users where email='teste@ci.com'")" = "Teste CI"
      - name: Testes
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            msg=$(grep -E "not ok|expected|actual|Error|^\s+[-+] " test.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Testes falharam::$msg"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
